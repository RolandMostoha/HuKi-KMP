appId: ${APP_ID}
---
- launchApp:
    clearState: false
    permissions: { all: allow }
- setLocation:
    latitude: 47.7168079
    longitude: 18.8950729
- extendedWaitUntil:
    visible:
      id: MAP_MAPBOX
    timeout: 10000
- tapOn: "Layers"
- tapOn: "Gpx Layer"

# Open test GPX from File Picker
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Search"
      - inputText: "gpx_test_with_comments"
      - tapOn: "gpx_test_with_comments.gpx"
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            # New simulator -> Recents is open -> we need to go to Browse
            notVisible:
              id: "BackButton"
          commands:
            # The Files picker is a separate process and can be slow
            - extendedWaitUntil:
                visible: "Browse"
                timeout: 5000
            - tapOn: "Browse"
            - tapOn:
                id: "gpx_test_with_comments, gpx"
      - runFlow:
          when:
            # Old simulator -> Browse is already open
            visible:
              id: "BackButton"
          commands:
            - tapOn:
                id: "gpx_test_with_comments, gpx"

# GPX Details
- extendedWaitUntil:
    visible:
      id: MAP_MAPBOX
    timeout: 2000
- extendedWaitUntil:
    visible: "gpx_test_with_comments.gpx"
    timeout: 5000
- assertVisible: "7H 28M"
- assertVisible: "22.6 KM"
- assertVisible: "1088 M"
- assertVisible: "516 M"
- assertVisible:
    id: GPX_DETAILS_START_BUTTON

# Expand the sheet to reveal the Maps navigation buttons (start + end waypoints are ~14km apart)
- swipe:
    start: 50%, 85%
    end: 50%, 35%
- assertVisible:
    id: GPX_DETAILS_NAV_START_BUTTON
- assertVisible:
    id: GPX_DETAILS_NAV_END_BUTTON
