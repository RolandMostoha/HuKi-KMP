appId: ${APP_ID}
---
# Place History: empty state via the Menu on a clean install, then populate it by
# selecting a search result and verify the place is listed, grouped under "Today",
# and re-opens on the map when tapped.
- launchApp:
    clearState: true
    permissions: { all: allow }
- setLocation:
    latitude: 47.7168079
    longitude: 18.8950729
- extendedWaitUntil:
    visible:
      id: MAP_MAPBOX
    timeout: 10000

# Open Place History from the Menu — empty state on a clean install.
- tapOn: "Menu"
- assertVisible:
    id: MENU_ROW_PLACE_HISTORY
- tapOn:
    id: MENU_ROW_PLACE_HISTORY
- extendedWaitUntil:
    visible:
      id: PLACE_HISTORY_SCREEN_ROOT
    timeout: 5000
# The empty state is asserted by its visible title (the InfoView container has no
# queryable id on iOS), which works on both platforms.
- extendedWaitUntil:
    visible: "Your place history is empty"
    timeout: 5000

# Back to the map via the screen back button and the menu back button.
- tapOn:
    id: PLACE_HISTORY_BACK_BUTTON
- assertVisible:
    id: MENU_SCREEN_ROOT
- tapOn:
    id: MENU_BACK_BUTTON
- assertVisible:
    id: MAP_MAPBOX

# Record a visit: search a place and select it.
- assertVisible: "Search..."
- tapOn: "Search..."
- inputText: "Pilisszentker"
- extendedWaitUntil:
    visible: "Pilisszentkereszt"
    timeout: 5000
- tapOn:
    id: SEARCH_RESULT_ITEM
    index: 0
- assertVisible:
    id: MAP_MAPBOX

# Open Place History again — the visited place is listed under the "Today" section.
- tapOn: "Menu"
- tapOn:
    id: MENU_ROW_PLACE_HISTORY
- extendedWaitUntil:
    visible:
      id: PLACE_HISTORY_SCREEN_ROOT
    timeout: 5000
- assertVisible:
    id: PLACE_HISTORY_LIST
- assertVisible:
    id: PLACE_HISTORY_ITEM

# Tapping the place re-opens it on the map (MainViewModel.showPlace).
- tapOn:
    id: PLACE_HISTORY_ITEM
- assertVisible:
    id: MAP_MAPBOX
