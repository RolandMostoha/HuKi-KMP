appId: ${APP_ID}
---
# Verifies that location permission is requested on demand (not at launch):
# GPX -> Start Navigation triggers the permission prompt when not granted yet.
- launchApp:
    clearState: true
    permissions: { all: unset }
- setLocation:
    latitude: 47.7168079
    longitude: 18.8950729
- extendedWaitUntil:
    visible:
      id: MAP_MAPBOX
    timeout: 10000

# Permission dialog must NOT appear at launch
- assertNotVisible: "Allow While Using App"
- assertNotVisible: "While using the app"
- assertVisible: "My location - Not available"

# Import test GPX (leaves the app on the GPX Details sheet)
- runFlow: subflows/maestro_flow_import_gpx.yaml

# GPX Details sheet is opened
- assertVisible: "Start Route"

# Start Navigation must request permission on demand (not granted yet)
- tapOn: "Start Route"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "While using the app"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
            visible: "Allow While Using App"
            timeout: 10000
            optional: false
      - tapOn: "Allow While Using App"

# After granting, navigation follows in live compass mode
- assertVisible: "My location - Live compass"
