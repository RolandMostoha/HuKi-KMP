appId: ${APP_ID}
---
# Place Details: long tap on the map drops a marker and raises the Place Details sheet,
# which starts in a loading state and fills in once the reverse geocoding resolves.
# The long press targets the map element instead of a screen point: on Android a
# point-based long press is not delivered to the Mapbox surface.
- launchApp:
    clearState: true
    arguments:
      skipWhatsNew: true
    permissions: { all: allow }
- setLocation:
    latitude: 47.7168079
    longitude: 18.8950729

- longPressOn:
    id: MAP_MAPBOX
- assertVisible:
    id: PLACE_DETAILS_SHEET

# The reverse geocoded name and address replace the loading state.
- extendedWaitUntil:
    visible:
      id: PLACE_DETAILS_TITLE
    timeout: 15000
- assertVisible:
    id: PLACE_DETAILS_ADDRESS
- assertVisible:
    id: PLACE_DETAILS_DISTANCE
- assertNotVisible:
    id: PLACE_DETAILS_LOADING

- assertVisible:
    id: PLACE_DETAILS_ROUTE_PLAN_BUTTON
- assertVisible:
    id: PLACE_DETAILS_MAPS_NAVIGATION_BUTTON

# Closing the sheet also removes the marker.
- tapOn:
    id: PLACE_DETAILS_CLOSE_BUTTON
- assertNotVisible:
    id: PLACE_DETAILS_SHEET
- assertVisible:
    id: MAIN_SEARCH_BAR

# The reverse geocoded place is saved into Place History.
- tapOn: "Search..."
- extendedWaitUntil:
    visible:
      id: RECENT_PLACES_SECTION
    timeout: 5000
- assertVisible:
    id: RECENT_PLACES_ITEM
