appId: ${APP_ID}
---
- launchApp:
    clearState: true
    arguments:
      skipWhatsNew: true
    permissions: { all: allow }
- extendedWaitUntil:
    visible:
      id: MAP_MAPBOX
    timeout: 10000
- assertVisible: "Search..."
- tapOn: "Search..."

# Destinations section is shown in the default (no query) state
- assertVisible:
    id: DESTINATIONS_SECTION
- assertVisible:
    id: DESTINATION_CARD
    index: 0

# Expanding a card keeps it visible (description switches to multiple lines)
- tapOn:
    id: DESTINATION_EXPAND_BUTTON
    index: 0
- assertVisible:
    id: DESTINATION_CARD
    index: 0

# Selecting a destination dismisses the Search sheet, moves the map camera and
# raises the Place Details sheet for it.
- tapOn:
    id: DESTINATION_CARD
    index: 0
- assertVisible:
    id: MAP_MAPBOX
- assertNotVisible:
    id: DESTINATIONS_SECTION
- extendedWaitUntil:
    visible:
      id: PLACE_DETAILS_TITLE
    timeout: 15000
- assertVisible:
    id: PLACE_DETAILS_ROUTE_PLAN_BUTTON

# Closing the Place Details sheet lands back on the map.
- tapOn:
    id: PLACE_DETAILS_CLOSE_BUTTON
- assertNotVisible:
    id: PLACE_DETAILS_SHEET
- assertVisible:
    id: MAP_MAPBOX
