appId: ${APP_ID}
---
- launchApp:
    clearState: true
    arguments:
      skipWhatsNew: true
    permissions: { all: allow }
- extendedWaitUntil:
    visible:
      id: MAP_MAPBOX
    timeout: 10000
- assertVisible: "Search..."
- tapOn: "Search..."

# Empty search results
- inputText: "Dobogoko12345ASDFG"
- assertVisible: "No results"
- tapOn: Clear text

# Local destination results appear instantly (no network, no debounce)
- inputText: "Dobog"
- assertVisible:
    id: DESTINATIONS_SECTION
- assertVisible: "Dobogókő"
- tapOn: Clear text

# Successful search results
- inputText: "Pilisszentker"
- assertVisible: "Pilisszentkereszt"
- tapOn:
    id: SEARCH_RESULT_ITEM
    index: 0
- assertVisible:
    id: MAP_MAPBOX

# Selecting a result raises the Place Details sheet with the already known place,
# so no loading state is shown.
- assertVisible:
    id: PLACE_DETAILS_SHEET
- assertVisible:
    id: PLACE_DETAILS_TITLE
- assertNotVisible:
    id: PLACE_DETAILS_LOADING
- tapOn:
    id: PLACE_DETAILS_CLOSE_BUTTON
- assertNotVisible:
    id: PLACE_DETAILS_SHEET
- assertVisible:
    id: MAIN_SEARCH_BAR
