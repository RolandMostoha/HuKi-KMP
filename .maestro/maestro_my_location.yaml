appId: ${APP_ID}
---
- launchApp:
    clearState: true
    permissions: { all: unset }
- setLocation:
    latitude: 47.7168079
    longitude: 18.8950729
- extendedWaitUntil:
    visible:
      id: MAP_MAPBOX
    timeout: 10000

# Permission dialog must NOT appear at launch — only on an explicit My Location request
- assertNotVisible: "Allow While Using App"
- assertNotVisible: "While using the app"

# Not available
- assertVisible: "My location - Not available"

# Allow permission
- tapOn:
    id: MAIN_FAB_MY_LOCATION_BUTTON
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "While using the app"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
            visible: "Allow While Using App"
            timeout: 5000
            optional: false
      - tapOn: "Allow While Using App"

# Following
- assertVisible: "My location - Following"

# Live Compass
- tapOn:
    id: MAIN_FAB_MY_LOCATION_BUTTON
- extendedWaitUntil:
    visible: SLEEP
    timeout: 3000
    optional: true
- assertVisible: "My location - Live compass"
- swipe:
    direction: LEFT

# Default
- assertVisible: "My location - Visible"