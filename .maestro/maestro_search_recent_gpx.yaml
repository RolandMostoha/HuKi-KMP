appId: ${APP_ID}
---
# Recent GPX: import a GPX file, then verify it appears in Search's Recent section and opens.
- launchApp:
    clearState: true
    permissions: { all: allow }
- setLocation:
    latitude: 47.7168079
    longitude: 18.8950729
- runFlow: subflows/maestro_flow_import_gpx.yaml

# Dismiss the GPX Details sheet to reveal the map and the search bar.
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          start: 50%, 80%
          end: 50%, 97%
          duration: 1200
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%, 73%
          end: 50%, 99%
          duration: 400

# Open Search with an empty query: the Recent GPX section is shown.
- assertVisible: "Search..."
- tapOn: "Search..."
- extendedWaitUntil:
    visible:
      id: RECENT_GPX_SECTION
    timeout: 5000
- assertVisible:
    id: RECENT_GPX_ITEM
    index: 0

# Tapping a recent file re-opens it on the map and dismisses the search sheet.
- tapOn:
    id: RECENT_GPX_ITEM
    index: 0
- assertVisible:
    id: MAP_MAPBOX
- assertNotVisible:
    id: RECENT_GPX_SECTION
