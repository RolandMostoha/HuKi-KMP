appId: ${APP_ID}
---
# GPX Collection: import a GPX file, open GpxCollection, GpxGuide
- launchApp:
    clearState: false
    arguments:
      skipWhatsNew: true
    permissions: { all: allow }
- setLocation:
    latitude: 47.7168079
    longitude: 18.8950729
- runFlow: subflows/maestro_flow_import_gpx.yaml

# Closing the GPX to reveal the Menu entry.
- tapOn:
    id: GPX_DETAILS_CLOSE_BUTTON

# Open the GPX Collection from the Menu
- tapOn: "Menu"
- tapOn:
    id: MENU_ROW_GPX_COLLECTION
- extendedWaitUntil:
    visible:
      id: GPX_COLLECTION_SCREEN_ROOT
    timeout: 5000
- assertVisible:
    id: GPX_COLLECTION_LIST
- assertVisible: "gpx_test_with_comments.gpx"

# Help opens the GPX Tutorial, then back returns to the collection
- tapOn:
    id: GPX_COLLECTION_HELP_BUTTON
- extendedWaitUntil:
    visible:
      id: GPX_GUIDE_SCREEN_ROOT
    timeout: 5000
- tapOn:
    id: GPX_GUIDE_BACK_BUTTON
- assertVisible:
    id: GPX_COLLECTION_SCREEN_ROOT

# Open the item options menu and trigger delete
- tapOn:
    id: GPX_COLLECTION_ITEM_OPTIONS_BUTTON
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: GPX_COLLECTION_ITEM_DELETE_BUTTON
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Delete"

# Confirm the delete dialog
- assertVisible: "Delete GPX file?"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: GPX_COLLECTION_DELETE_DIALOG_CONFIRM_BUTTON
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Delete"

# The file is gone and the empty state is shown
- extendedWaitUntil:
    notVisible: "gpx_test_with_comments.gpx"
    timeout: 5000
- assertVisible: "Your GPX collection is empty"
