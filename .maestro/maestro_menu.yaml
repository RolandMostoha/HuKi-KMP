appId: ${APP_ID}
---
- launchApp:
    clearState: true
    arguments:
      skipWhatsNew: true
    permissions: { all: allow }
- extendedWaitUntil:
    visible:
      id: MAP_MAPBOX
    timeout: 10000

# Open Menu
- tapOn: "Menu"

# Hero
- assertVisible: "HuKi"
- assertVisible: "Hungarian Hiking Map"
- assertVisible: "(Android|iOS) v\\d+(\\.\\d+)+"

# Contact section — scroll into view if the screen is short
- scrollUntilVisible:
    element:
      id: MENU_ROW_EMAIL
    direction: DOWN
    centerElement: true
- assertVisible: "Contact"
- assertVisible:
    id: MENU_ROW_EMAIL
- assertVisible: "huki.app@gmail.com"
- assertVisible:
    id: MENU_ROW_FACEBOOK
- assertVisible: "Facebook"
- assertVisible:
    id: MENU_ROW_GITHUB
- assertVisible: "GitHub repository"

# Legal section — scroll into view if the screen is short
- scrollUntilVisible:
    element:
      text: "Legal"
    direction: DOWN
- assertVisible: "Legal"
- assertVisible:
    id: MENU_ROW_PRIVACY_POLICY

# Services section — scroll into view if the screen is short
- scrollUntilVisible:
    element:
      text: "Services"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: MENU_ROW_GRAPHHOPPER
    direction: DOWN
    centerElement: true
- assertVisible: "GraphHopper"
- scrollUntilVisible:
    element:
      id: MENU_ROW_LOCATION_IQ
    direction: DOWN
    centerElement: true
- assertVisible: "Location IQ"

# Open LocationIQ supporter page and return
- tapOn:
    id: MENU_ROW_LOCATION_IQ
- assertVisible:
    id: LOCATION_IQ_SCREEN_ROOT
- assertVisible:
    id: LOCATION_IQ_VISIT_WEBSITE
- tapOn:
    id: LOCATION_IQ_BACK_BUTTON
- assertVisible:
    id: MENU_SCREEN_ROOT

# Back navigation returns to the map
- tapOn:
    id: MENU_BACK_BUTTON
- assertVisible:
    id: MAP_MAPBOX
