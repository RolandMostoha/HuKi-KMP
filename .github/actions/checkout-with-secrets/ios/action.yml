name: "Checkout with secrets"
description: "Checkout the repository with secrets"
inputs:
  MAPBOX_ACCESS_TOKEN_IOS:
    description: "MapBox Access Token (iOS)"
    required: true
  LOCATION_IQ_API_KEY_IOS:
    description: "LocationIQ API Key (iOS)"
    required: true
  GRAPHHOPPER_API_KEY_IOS:
    description: "GraphHopper API Key (iOS)"
    required: true
  MAPBOX_ACCESS_TOKEN_ANDROID:
    description: "MapBox Access Token (Android)"
    required: true
  LOCATION_IQ_API_KEY_ANDROID:
    description: "LocationIQ API Key (Android)"
    required: true
  GRAPHHOPPER_API_KEY_ANDROID:
    description: "GraphHopper API Key (Android)"
    required: true
  HUKI_ROUTING_API_KEY:
    description: "HuKi-Routing API Key"
    required: true
  GOOGLE_SERVICE_INFO_PLIST_BASE64:
    description: "Firebase GoogleService-Info.plist as Base64 string"
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout code with history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Copy MAPBOX_ACCESS_TOKEN_IOS to secrets.properties
      shell: bash
      run: echo "MAPBOX_ACCESS_TOKEN_IOS=\"${{ inputs.MAPBOX_ACCESS_TOKEN_IOS }}\"" >> ./secrets.properties

    - name: Copy LOCATION_IQ_API_KEY_IOS to secrets.properties
      shell: bash
      run: echo "LOCATION_IQ_API_KEY_IOS=\"${{ inputs.LOCATION_IQ_API_KEY_IOS }}\"" >> ./secrets.properties

    - name: Copy GRAPHHOPPER_API_KEY_IOS to secrets.properties
      shell: bash
      run: echo "GRAPHHOPPER_API_KEY_IOS=\"${{ inputs.GRAPHHOPPER_API_KEY_IOS }}\"" >> ./secrets.properties

    - name: Copy MAPBOX_ACCESS_TOKEN_ANDROID to secrets.properties
      shell: bash
      run: echo "MAPBOX_ACCESS_TOKEN_ANDROID=\"${{ inputs.MAPBOX_ACCESS_TOKEN_ANDROID }}\"" >> ./secrets.properties

    - name: Copy LOCATION_IQ_API_KEY_ANDROID to secrets.properties
      shell: bash
      run: echo "LOCATION_IQ_API_KEY_ANDROID=\"${{ inputs.LOCATION_IQ_API_KEY_ANDROID }}\"" >> ./secrets.properties

    - name: Copy GRAPHHOPPER_API_KEY_ANDROID to secrets.properties
      shell: bash
      run: echo "GRAPHHOPPER_API_KEY_ANDROID=\"${{ inputs.GRAPHHOPPER_API_KEY_ANDROID }}\"" >> ./secrets.properties

    - name: Copy HUKI_ROUTING_API_KEY to secrets.properties
      shell: bash
      run: echo "HUKI_ROUTING_API_KEY=\"${{ inputs.HUKI_ROUTING_API_KEY }}\"" >> ./secrets.properties

    - name: Create GoogleService-Info.plist
      shell: bash
      run: echo "${{ inputs.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist
